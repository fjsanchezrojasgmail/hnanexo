<div class="hn-table-selection" id="item-list">
  <p-table #dt
  [columns]="cols"
  [value]="admListService.listing"
  [paginator]="true"
  [rows]="paginationTable"
  paginatorPosition="top"
  [totalRecords]="admListService.listing.length"
  [scrollable]="true"
  class="hn-table-scroll hn-full-height-split-button hn-paginator-top
  hn-table-without-button hn-without-last-update hn-without-refresh
  hn-table-without-border hn-table-font-12 hn-table-filter hn-wide hn-row-datatable-40
  hn-table-selection"
  [ngClass]="{'no-paginator': admListService.listing.length <= 0}">
  <ng-template pTemplate="header" let-columns>
    <!-- Cabecera para las columnas que sean para ordenar sus campos -->
    <tr>
      <ng-container *ngFor="let col of columns" [ngSwitch]="col.field">

        <!-- Estado -->
        <th
          [pSortableColumn]="col.field"
          *ngSwitchCase="'state'"
          class="hn-width-column-status">
            <span>{{col.header}}</span>
            <p-sortIcon [field]="col.field"></p-sortIcon>
        </th>

        <!-- Acciones -->
        <th
          *ngSwitchCase="'actions'"
          class="hn-width-column-action">
        </th>

        <!-- Columnas a las que no les definimos clases específicas -->
        <th  [pSortableColumn]="col.field" *ngSwitchDefault>
            <span>{{col.header}}</span>
            <p-sortIcon [field]="col.field"></p-sortIcon>
        </th>
      </ng-container>
    </tr>
    <!-- Cabecera para los filtros de la tabla -->
    <tr>
      <ng-container *ngFor="let col of columns" [ngSwitch]="col.field" >

        <!-- Código -->
        <th *ngSwitchCase="'code'">
          <hn-input-text-component
            name="code"
            [(ngModel)]="codeValue"
            [icon]="codeSearchicon"
            (methodOnKeyup)="onChangeFilterCode()"
            (input)="onFilterInput($event,col.field,'contains')">
          </hn-input-text-component>
        </th>
        <!-- Descripción -->
        <th *ngSwitchCase="'description'">
          <hn-input-text-component
            name="description"
            [(ngModel)]="descriptionValue"
            [icon]="descriptionSearchicon"
            (methodOnKeyup)="onChangeFilterDescription()"
            (input)="onFilterInput($event,col.field,'contains')">
          </hn-input-text-component>
        </th>

        <!-- Tipo-->
        <th *ngSwitchCase="'typeProduct'" class="ov-visible">
          <hn-combo-component
            name="type"
            [options]="admListService.types"
            (methodOnChange)="onFilterInput($event,col.field,'equals')">
          </hn-combo-component>
        </th>

        <!-- Estado -->
        <th *ngSwitchCase="'state'" class="ov-visible">
          <hn-combo-component
            name="state"
            [options]="states"
            (methodOnChange)="onFilterInput($event,col.field,'equals')">
          </hn-combo-component>
        </th>

        <!-- Acciones -->
        <th
          *ngSwitchCase="'actions'"
          class="hn-width-column-action">
        </th>
      </ng-container>
    </tr>
  </ng-template>

  <!-- Body de la tabla -->
  <ng-template pTemplate="body" let-rowData let-columns="columns">
    <tr [pSelectableRow]="rowData">
      <ng-container *ngFor="let col of columns" [ngSwitch]="col.field">

        <!-- En el caso de que sea la columna typeProduct -->
        <td *ngSwitchCase="'typeProduct'" class="text-justify" (click)="onActionDetail(rowData)">
          <span>{{ getTypeProductLabel(rowData[col.field]) }}</span>
        </td>

        <!-- En el caso de que sea la columna state mostramos el componente switch -->
        <td *ngSwitchCase="'state'" class="hn-width-column-status" (click)="onActionDetail(rowData)">
          <hn-switch-component
            labelOn = "{{ getTraductMessage('label.adm.table.state.active') }}"
            labelOff = "{{ getTraductMessage('label.adm.table.state.pasive') }}"
            [(ngModel)] = "rowData[col.field]"
            [disabled]="true">
          </hn-switch-component>
        </td>

        <!-- Acciones -->
        <td *ngSwitchCase="'actions'" class="hn-width-column-action cursor-default">
          <hn-split-button-component tooltip="getTraductMessage('label.adm.table.more.actions')">

            <!-- Botón de consultar -->
            <hn-item-split-button-component  [default]="true" label="getTraductMessage('label.actions.detail')" classIcono="ui-hn-icon icon-view" (action)="onActionDetail(rowData)">
            </hn-item-split-button-component>

            <!-- Botón de modificar -->
            <hn-item-split-button-component label="getTraductMessage('label.actions.edit')" classIcono="ui-hn-icon icon-adjustable-wrench" (action)="onActionEdit(rowData)">
            </hn-item-split-button-component>

          </hn-split-button-component>

        </td>

        <!-- Por defecto mostramos el contenido de la columna -->
        <td *ngSwitchDefault class="text-justify" (click)="onActionDetail(rowData)">
          <span>{{rowData[col.field]}}</span>
        </td>
      </ng-container>
    </tr>
  </ng-template>

  <ng-template pTemplate="paginatorright">
    <div class="hn-list-menu-action silver-background head-container">
        <span class="numPage hn-without-last-update hn-without-refresh"
          *ngIf="admListService.listing.length > 0">
          {{ getElementsPerPages(dt,'label.of') }}
        </span>

          <!-- Botón nuevo grupo -->
          <hn-button-component class="hn-button-text-bold" tooltip="{{ getTraductMessage('label.button.create.item') }}"
             type="button" [mainButton]="true" label="{{ getTraductMessage('label.button.create.item') }}"
            icon="ui-hn-icon icon-add" (click)="openCreateDetail()">
      </hn-button-component>
    </div>
  </ng-template>

  <ng-template pTemplate="emptymessage" let-columns>
    <tr class="non-selectable">
        <td colspan="3">
            <!-- Mensaje sin resultados-->
            <anexo-hn-message *ngIf="!admListService.error"
            [severity] = "'info'"
            [messageTitle] = "getTraductMessage('label.adm.table.message.not.results.title')"
            [messageText] = "getTraductMessage('label.adm.table.message.not.results.text')"
            >
          </anexo-hn-message>

          <!-- Error -->
          <anexo-hn-message *ngIf="admListService.error"
            [severity] = "'error'"
            [messageTitle] = "getTraductMessage('message.error.text.generic')">
          </anexo-hn-message>
        </td>
    </tr>
  </ng-template>
</p-table>
</div>
